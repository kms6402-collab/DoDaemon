{{define "dashboard.html"}}
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoDaemon</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> DoDaeMon</div>
    <div class="brand-tagline">TFTP · FTP · SYSLOG 서버 콘솔</div>

    <div class="nav-label">서비스</div>
    <nav id="service-nav">
      {{range .Services}}
      <div class="service-item{{if .Enabled}} on{{end}}" data-key="{{.Key}}">
        <span class="status-dot"></span>
        <div class="info">
          <div class="name">{{.Name}}</div>
          <div class="proto">{{.Protocol}}</div>
        </div>
      </div>
      {{end}}
    </nav>

    <div class="sidebar-bottom">
      <a class="btn small" href="/settings">⚙ 설정</a>
      <a class="btn small" href="/logout">로그아웃</a>
    </div>
  </aside>

  <main>
    <div class="breadcrumb">패킷 서비스</div>
    <div class="detail-header">
      <div>
        <h1 id="detail-title">-</h1>
        <div class="detail-meta" id="detail-meta">-</div>
      </div>
      <div class="detail-actions">
        <span class="badge off" id="detail-status"><span class="dot"></span>확인 중</span>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-value" id="kpi-active">0</div><div class="kpi-label">활성 연결</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-total">0</div><div class="kpi-label">총 연결 (세션 중)</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-errors">0</div><div class="kpi-label">오류</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-lastactivity">-</div><div class="kpi-label">마지막 활동</div></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="title">활성 세션</span>
        <span class="badge on" id="active-count-badge"><span class="dot"></span>0개</span>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table" id="active-table">
          <thead><tr><th>클라이언트</th><th>방향/종류</th><th>파일/내용</th><th>시작 시각</th></tr></thead>
          <tbody id="active-tbody">
            <tr><td colspan="4" class="empty">활성 세션이 없습니다.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel dark">
      <div class="panel-header">
        <span class="title">이벤트 로그</span>
        <div class="filter-pills" id="log-filters">
          <button class="filter-pill active" data-level="all">전체</button>
          <button class="filter-pill" data-level="info">INFO</button>
          <button class="filter-pill" data-level="error">ERROR</button>
        </div>
        <label class="toggle-mini"><input type="checkbox" id="autoscroll" checked> 자동 스크롤</label>
        <span class="badge on" id="conn-badge"><span class="dot" id="conn-dot"></span>연결됨</span>
      </div>
      <div class="log-viewer" id="log-viewer">
        <div class="empty">아직 수신된 이벤트가 없습니다.</div>
      </div>
    </div>
  </main>
</div>
<script>window.__DODAEMON__ = {{.BootstrapJS}};</script>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
